# Corrected real-ecology regime: known opaque population, hidden demographics/structure.
seed: 116
environment:
  data_mode: real
  expose_rk: hidden
  population: Amur tiger
  kind: ricker
  control_mode: setpoint_cumulative
  reward_mode: safe
  collapse_penalty: 5.0
  safety_penalty_mode: occupancy
  observation_noise_sigma: 0.2
dataset:
  transitions: 4000
  episode_length: 25
  output: outputs/hidden_rk/dataset_public.npz
  private_output: outputs/hidden_rk/dataset_private.npz
filter:
  particles: 256
  proposal: learned
  ess_fraction: 0.5
model:
  ensemble_size: 5
  ridge: 0.001
  native_state_bins: 61
  native_vi_iterations: 250
  native_vi_tolerance: 1.0e-7
planner:
  horizon: 5
  sequences: 96
  particles: 32
  discount: 0.95
  pessimism: 0.5
evaluation:
  seeds: [7001, 7051, 7101, 7151, 7201]
  episodes_per_seed: 4
  horizon: 50
  discount: 0.95
  output_dir: outputs/hidden_rk/evaluation
training:
  enabled: true
  holdout_fraction: 0.2
  plot: true
  wandb: false
