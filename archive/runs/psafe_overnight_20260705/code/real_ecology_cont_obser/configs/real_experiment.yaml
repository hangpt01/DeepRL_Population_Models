# First diagnostic/pilot config for the real-ecology reward-mode experiment.
seed: 116
environment:
  population: Amur tiger
  kind: ricker
  reward_mode: safe
  observation_noise_sigma: 0.2
dataset:
  transitions: 4000
  episode_length: 25
  output: outputs/real_experiment/dataset_public.npz
  private_output: outputs/real_experiment/dataset_private.npz
filter:
  particles: 256
  proposal: learned
  ess_fraction: 0.5
model:
  ensemble_size: 5
  ridge: 0.001
planner:
  horizon: 5
  sequences: 96
  particles: 32
  discount: 0.95
  pessimism: 0.5
evaluation:
  seeds: [7001, 7051, 7101, 7151, 7201]
  episodes_per_seed: 4
  horizon: 50
  discount: 0.95
  output_dir: outputs/real_experiment/evaluation
training:
  enabled: true
  holdout_fraction: 0.2
  plot: true
  wandb: false
