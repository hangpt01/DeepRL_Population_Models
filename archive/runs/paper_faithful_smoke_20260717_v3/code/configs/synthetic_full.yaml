seed: 116
environment:
  data_mode: synthetic
  kind: allee
  num_actions: 5
  control_mode: tier2_one_step
  horizon: 50
  K_base: 500.0
  r_base_low: 0.12
  r_base_high: 0.30
  C_low: 90.0
  C_high: 150.0
  theta_low: 3.0
  theta_high: 6.0
  regime_persistence: 0.90
  process_noise_sigma: 0.0
  observation_noise_sigma: 0.2
  safety_threshold: 50.0
  collapse_penalty: 20.0
  alpha: 1.0
  K_ref: 500.0
  initial_log_sigma: 0.7
