planner:
  horizon: 5
  sequences: 64
  particles: 16
  discount: 0.95
  pessimism: 0.5
evaluation:
  seeds: [7001, 7051, 7101, 7151, 7201]
  episodes_per_seed: 50
  horizon: 50
  discount: 0.95
  output_dir: outputs/evaluation
