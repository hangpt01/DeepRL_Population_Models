# Default synthetic set-point-r / cumulative-K configuration for experimentation.
seed: 116
environment:
  data_mode: dummy
  population: Dummy baseline
  kind: ricker
  control_mode: setpoint_cumulative
  num_actions: 5
  reward_mode: safe
  observation_noise_sigma: 0.2
dataset:
  transitions: 2000
  episode_length: 25
  output: outputs/dummy_default/dataset_public.npz
  private_output: outputs/dummy_default/dataset_private.npz
filter:
  particles: 256
  proposal: learned
model:
  ensemble_size: 5
planner:
  horizon: 5
  sequences: 96
  particles: 32
evaluation:
  seeds: [7001, 7051, 7101, 7151, 7201]
  episodes_per_seed: 4
  horizon: 50
  output_dir: outputs/dummy_default/evaluation
training:
  enabled: true
  holdout_fraction: 0.2
  plot: true
  wandb: false
