[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecorl-real-ecology"
version = "0.1.0"
description = "Continuous-observation ecological offline RL benchmark with real and dummy set-point data modes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ecology benchmark contributors"}]
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
paper-faithful-fit = ["torch>=2.2"]

[project.scripts]
real-ecology = "real_ecology_benchmark.cli:main"
ecology-benchmark = "real_ecology_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
