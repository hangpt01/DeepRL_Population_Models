# Small smoke cell for the synthetic set-point-r / cumulative-K mode.
seed: 116
environment:
  data_mode: dummy
  population: Dummy baseline
  kind: ricker
  control_mode: setpoint_cumulative
  num_actions: 5
  reward_mode: safe
  observation_noise_sigma: 0.1
dataset:
  transitions: 300
  episode_length: 12
  output: outputs/dummy_smoke/dataset_public.npz
  private_output: outputs/dummy_smoke/dataset_private.npz
filter:
  particles: 64
  proposal: reference
model:
  ensemble_size: 3
planner:
  horizon: 3
  sequences: 16
  particles: 8
evaluation:
  seeds: [9001]
  episodes_per_seed: 1
  horizon: 8
  output_dir: outputs/dummy_smoke/evaluation
training:
  enabled: true
  holdout_fraction: 0.2
  plot: false
  wandb: false
