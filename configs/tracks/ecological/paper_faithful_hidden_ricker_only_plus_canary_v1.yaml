# Structural smoke only: reduced compute validates routing/artifacts, not production runtime.
seed: 116
environment:
  data_mode: real
  expose_rk: hidden
  population: Amur tiger
  kind: ricker
  control_mode: setpoint_cumulative
  reward_mode: safe
  collapse_penalty: 5.0
  safety_penalty_mode: occupancy
  observation_noise_sigma: 0.1
dataset:
  transitions: 160
  episode_length: 25
  output: outputs/ricker_only_plus_canary/dataset_public.npz
  private_output: outputs/ricker_only_plus_canary/dataset_private.npz
filter:
  particles: 64
  proposal: faithful_internal
model:
  ensemble_size: 3
  ridge: 0.001
planner:
  horizon: 5
  sequences: 96
  particles: 32
  discount: 0.95
evaluation:
  seeds: [7001]
  episodes_per_seed: 1
  horizon: 10
  discount: 0.95
  output_dir: outputs/ricker_only_plus_canary/evaluation
training:
  enabled: true
  holdout_fraction: 0.2
  plot: false
  wandb: false
faithful:
  model:
    equation_version: adapted_mechanistic_v2
    forms: [ricker]
    candidates_per_form: 8
    prior: uniform
    minimum_candidate_distance: 0.0001
  fit:
    optimizer: torch_lbfgs
    regularization_variant: none_structural_v1
    starts: 2
    iterations: 12
    mc_paths: 4
    regime_mc_paths: 8
    history_fraction: 0.8
    sparse_action_rows: 25
  fit_cache_dir: outputs/ricker_only_plus_canary/fit_cache
  planner:
    name: pbvi
    state_bins: 15
    capacity_bins: 5
    observation_bins: 15
    transition_samples: 16
    observation_samples: 16
    belief_points: 4
    observation_branches: 3
    horizon: 2
