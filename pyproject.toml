[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeprl-population-models"
version = "0.1.0"
description = "Two-track reproducible ecological offline-RL research repository"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "MIT (provisional; see LICENSE_STATUS.md)"}
authors = [{name = "Ecology benchmark contributors"}]
dependencies = [
  "numpy==2.2.6",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
]
paper-faithful-fit = [
  "torch>=2.2",
]
dev = [
  "pytest>=9,<10",
  "ruff>=0.12,<0.13",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

